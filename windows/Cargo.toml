[package]
name = "nearlink"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A small native Windows tray client for NearLink battery sharing"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-future = "0.3.2"
windows = { version = "0.62.2", features = [
    "Devices_Bluetooth", "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile", "Devices_Enumeration",
    "Foundation", "Foundation_Collections", "Storage_Streams",
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Com",
    "Win32_System_LibraryLoader", "Win32_System_Registry",
    "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_Controls", "Win32_UI_HiDpi",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
